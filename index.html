<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Auto Evolution 3D</title>
<meta name="description" content="Interactive 3D history of the automobile, from the 1886 Benz to modern F1, hypercars, karts and luxury cars.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06070b;--panel:rgba(12,14,20,.74);--line:rgba(255,255,255,.09);--txt:#e9edf5;--mut:#8a93a6;--acc:#ff4d6d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px}

/* ---------- Loader ---------- */
#loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at center,#121420 0%,#05060a 70%);transition:opacity .8s,visibility .8s}
#loader.done{opacity:0;visibility:hidden}
.ld-logo{font:800 30px Orbitron,sans-serif;letter-spacing:.2em}
.ld-logo b{color:var(--acc)}
.ld-car{width:260px;height:90px}
.ld-car path{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.4s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px var(--acc))}
.ld-car circle{fill:none;stroke:#fff;stroke-width:2.5;stroke-dasharray:4 5;animation:spin 1s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-bar{width:240px;height:3px;background:#1b1e29;border-radius:3px;overflow:hidden}
.ld-bar i{display:block;height:100%;width:5%;background:linear-gradient(90deg,var(--acc),#ffd36b);transition:width .4s}
#ldText{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--mut)}

/* ---------- Header / credit ---------- */
.brand{position:fixed;top:18px;left:22px;z-index:20;font:800 17px Orbitron,sans-serif;letter-spacing:.14em;user-select:none}
.brand b{color:var(--acc);transition:color .6s}
.brand small{display:block;font:500 10px Inter,sans-serif;letter-spacing:.28em;color:var(--mut);margin-top:5px}
#credit{position:fixed;top:16px;right:18px;z-index:90;padding:9px 14px;font-size:12px;letter-spacing:.05em;color:var(--mut);border-radius:12px;white-space:nowrap}
#credit b{font:700 12px Orbitron,sans-serif;letter-spacing:.08em;background:linear-gradient(90deg,var(--acc),#ffd36b);-webkit-background-clip:text;background-clip:text;color:transparent}

#searchWrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(470px,calc(100vw - 560px));min-width:300px;z-index:30}
#searchForm{display:flex;align-items:center;gap:8px;height:48px;padding:0 6px 0 14px;border-radius:14px;transition:border-color .3s,box-shadow .3s}
#searchForm:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
#searchForm svg{flex:none;opacity:.6}
#q{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font-size:14px}
#q::placeholder{color:#6b7385}
#searchForm kbd{font:600 11px Inter;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
#searchForm button{height:36px;padding:0 16px;border:0;border-radius:10px;background:var(--acc);color:#0a0a0a;font-weight:700;font-size:13px;cursor:pointer;transition:filter .2s}
#searchForm button:hover{filter:brightness(1.15)}
#searchForm.ghost{visibility:hidden}
#searchForm.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#suggest{position:absolute;top:56px;left:0;right:0;display:none;overflow:hidden;padding:6px}
#suggest.on{display:block}
.sg{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px}
.sg:hover,.sg.sel{background:rgba(255,255,255,.07)}
.sg i{width:8px;height:8px;border-radius:50%;flex:none}
.sg span{margin-left:auto;color:var(--mut);font-size:12px}
.sg.none{cursor:default;color:var(--mut);line-height:1.5}
#shards{position:fixed;inset:0;pointer-events:none;z-index:40}
.shard{position:fixed;display:grid;place-items:center;overflow:hidden;font:700 9px Orbitron,sans-serif;letter-spacing:.12em;color:var(--acc);background:rgba(20,23,32,.92);border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);box-shadow:0 0 18px -4px var(--acc);transition:transform .9s cubic-bezier(.15,.85,.25,1),opacity .9s}
#explain{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:35;width:min(470px,calc(100vw - 24px));font:500 12px ui-monospace,Menlo,Consolas,monospace;line-height:1.75;color:#cfe7ff;padding:10px 14px;opacity:0;pointer-events:none;transition:opacity .4s}
#explain.on{opacity:1}
#explain div{animation:typein .35s ease-out both}
#explain b{color:var(--acc)}
@keyframes typein{from{opacity:0;transform:translateX(-8px)}}

/* ---------- Category chips ---------- */
#cats{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:25;display:flex;gap:6px;padding:5px;border-radius:14px;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;transition:opacity .3s}
#cats::-webkit-scrollbar{display:none}
#cats.hide{opacity:0;pointer-events:none}
.cat{flex:none;border:0;background:none;padding:7px 12px;border-radius:10px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .25s}
.cat i{width:7px;height:7px;border-radius:50%}
.cat:hover{color:var(--txt)}
.cat.on{background:rgba(255,255,255,.1);color:var(--txt)}

/* ---------- Info panel ---------- */
#info{position:fixed;left:20px;top:128px;width:340px;max-height:calc(100vh - 262px);overflow-y:auto;z-index:20;padding:20px;scrollbar-width:thin}
#infoToggle{display:none}
.ihead{display:flex;justify-content:space-between;align-items:center}
.chip{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;color:#0a0a0a;background:var(--acc)}
#iCount{font-size:11px;color:var(--mut);letter-spacing:.1em}
.year{font:800 46px Orbitron,sans-serif;line-height:1;margin-top:14px;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--acc) 70%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
#iName{font-size:22px;font-weight:700;margin:8px 0 10px;line-height:1.2}
#iDesc{font-size:13px;line-height:1.6;color:#b9c1d0}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.specs div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.specs span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.specs b{font-size:12.5px;font-weight:600;line-height:1.35}
.feature{border-radius:12px;padding:12px 14px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,transparent),transparent);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.feature span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.feature p{font-size:13px;line-height:1.55;margin-top:5px}
#info h3{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
#info h3 small{letter-spacing:0;text-transform:none;font-weight:400}
#iFacts{list-style:none;display:grid;gap:8px}
#iFacts li{font-size:12.5px;line-height:1.5;padding-left:16px;position:relative;color:#c7cedb}
#iFacts li:before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:2px;background:var(--acc);transform:rotate(45deg)}
.parts{display:flex;flex-wrap:wrap;gap:6px}
.parts button{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:8px;padding:5px 9px;font-size:11.5px;cursor:pointer;transition:all .2s}
.parts button:hover,.parts button.on{border-color:var(--acc);color:var(--acc)}
.fade-in{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}

/* ---------- Tools ---------- */
#tools{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;padding:6px}
#tools button{position:relative;width:44px;height:44px;border:0;border-radius:11px;background:none;cursor:pointer;font-size:18px;font-weight:700;display:grid;place-items:center;color:var(--mut);transition:all .2s}
#tools button:hover{background:rgba(255,255,255,.07);color:var(--txt)}
#tools button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
#tools button:after{content:attr(data-tip);position:absolute;right:54px;white-space:nowrap;font-size:11px;font-weight:600;padding:5px 9px;border-radius:7px;background:#11141c;border:1px solid var(--line);opacity:0;pointer-events:none;transform:translateX(6px);transition:all .2s}
#tools button:hover:after{opacity:1;transform:none}

/* ---------- Part labels ---------- */
#tags{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0;transition:opacity .35s}
#tags.on{opacity:1}
#tags.on .tag{pointer-events:auto}
.tag{position:absolute;left:0;top:0;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:11px;font-weight:600;padding:3px 9px 3px 3px;border-radius:999px;background:rgba(10,12,18,.78);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tag .n{width:18px;height:18px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#000;font-size:10px;font-weight:700}
.tag .d{display:none}
.tag.active{z-index:5;flex-direction:column;align-items:flex-start;white-space:normal;width:250px;border-radius:12px;padding:10px 12px;font-size:13px;border-color:var(--acc);box-shadow:0 0 32px -6px var(--acc);background:rgba(10,12,18,.92)}
.tag.active .d{display:block;font-weight:400;color:#c7cedb;line-height:1.5;font-size:12px}
.tag.active:after{content:"";position:absolute;left:50%;bottom:-12px;width:1px;height:12px;background:var(--acc)}

#phase{position:fixed;left:50%;bottom:124px;transform:translateX(-50%);z-index:18;padding:8px 16px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.06em;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:opacity .4s}
#phase i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
#phase.idle{opacity:.55}

/* ---------- Timeline ---------- */
#timeline{position:fixed;left:20px;right:20px;bottom:16px;height:96px;z-index:20;display:flex;align-items:stretch;gap:6px;padding:8px}
.navb{flex:none;width:46px;border:0;border-radius:11px;background:rgba(255,255,255,.04);font-size:22px;cursor:pointer;transition:all .2s}
.navb:hover{background:var(--acc);color:#000}
#track{position:relative;flex:1;margin:0 18px}
#ticks,#dots{position:absolute;left:0;right:0}
#dots{top:4px;height:46px}
#ticks{bottom:0;height:22px;font-size:10px;color:var(--mut);letter-spacing:.1em}
#ticks span{position:absolute;bottom:0;transform:translateX(-50%)}
#ticks span:before{content:"";position:absolute;left:50%;top:-8px;width:1px;height:5px;background:var(--line)}
#line{position:absolute;left:0;right:0;bottom:30px;height:2px;background:linear-gradient(90deg,#f5c26b,#e8a87c,#ff4d6d,#4dd2ff,#c9a6ff);opacity:.35;border-radius:2px}
.dot{position:absolute;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid #06070b;cursor:pointer;transition:transform .25s,opacity .25s,box-shadow .25s}
.dot:hover{transform:scale(1.5)}
.dot.dim{opacity:.18}
.dot.active{transform:scale(1.6);box-shadow:0 0 0 3px #06070b,0 0 0 5px var(--acc),0 0 18px var(--acc)}
#scrub{position:absolute;left:-8px;right:-8px;width:calc(100% + 16px);bottom:22px;height:18px;-webkit-appearance:none;appearance:none;background:none;cursor:grab}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--acc);box-shadow:0 0 12px var(--acc)}
#scrub::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
#bubble{position:absolute;bottom:58px;transform:translateX(-50%);font-size:11px;font-weight:600;white-space:nowrap;padding:5px 9px;border-radius:8px;background:#11141c;border:1px solid var(--acc);opacity:0;pointer-events:none;transition:opacity .2s}
#bubble.on{opacity:1}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:50;padding:14px 20px;font-size:13px;opacity:0;pointer-events:none;transition:all .3s;text-align:center;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- Responsive ---------- */
@media (max-width:1100px){#searchWrap{width:min(420px,calc(100vw - 420px))}}
@media (max-width:820px){
  .brand{top:14px;left:14px;font-size:14px}
  .brand small{font-size:9px;letter-spacing:.2em}
  #credit{top:12px;right:12px;padding:7px 10px;font-size:11px}
  #credit b{font-size:11px}
  #searchWrap{top:60px;left:12px;right:12px;width:auto;min-width:0;transform:none}
  #searchForm kbd{display:none}
  #cats{top:116px;left:12px;right:12px;transform:none;max-width:none}
  #explain{top:116px}
  #info{left:10px;right:10px;top:auto;bottom:120px;width:auto;max-height:42vh;padding:14px 16px;transition:max-height .4s}
  #info.collapsed{max-height:92px;overflow:hidden}
  #infoToggle{display:grid;place-items:center;position:absolute;right:10px;top:10px;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.05);cursor:pointer;transition:transform .3s}
  #info.collapsed #infoToggle{transform:rotate(180deg)}
  .ihead{padding-right:40px}
  .year{font-size:30px;margin-top:8px}
  #iName{font-size:18px;margin:4px 0 8px}
  #tools{top:172px;right:10px;transform:none;flex-direction:column;padding:4px}
  #tools button{width:38px;height:38px;font-size:16px}
  #tools button:after{display:none}
  #phase{bottom:auto;top:172px;font-size:11px;padding:6px 12px;max-width:calc(100vw - 80px);overflow:hidden;text-overflow:ellipsis}
  #timeline{left:10px;right:10px;bottom:10px;height:96px}
  .navb{width:36px}
  #track{margin:0 10px}
  .tag.active{width:200px}
  #ticks span.odd{display:none}
}
@media (max-width:820px) and (max-height:700px){#info{max-height:34vh}}
</style>

/* =====================================================================

      { id, name, year, cat, color, build:{type,...}, desc, specs:{engine,power,top}, facts:[], feature }
      build.type: 'motorwagen' | 'horseless' | 'cigar' | 'profile' | 'f1' | 'kart'

const CATS = {

  racing:  { label: 'Racing',     color: '#4dd2ff' },
  f1:      { label: 'Formula 1',  color: '#ff3b30' },
  kart:    { label: 'Karts',      color: '#a3ff4d' },
  luxury:  { label: 'Luxury',     color: '#c9a6ff' },
};

const CARS = [
  // ---------------- FIRST CARS ----------------
  { id:'benz', name:'Benz Patent-Motorwagen', year:1886, cat:'first', color:0x1c1c1c, build:{type:'motorwagen'},

  x.fillStyle = '#111'; x.font = 'bold 128px Arial, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(num, 128, 138);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.MeshStandardMaterial({ map: t, transparent: true, roughness: 0.5, polygonOffset: true, polygonOffsetFactor: -2, side: THREE.DoubleSide });
  m.userData.own = true;
  return mk(new THREE.PlaneGeometry(size, size), m);
}

/* ---------- Wheels (axle along Z, outer face +Z) ---------- */
function makeWheel(r, w, style, o = {}) {
  const g = new THREE.Group();
  const side = { artillery: 0.05, wire: 0.06, disc: r * 0.32, alloy: r * 0.3, alloy8: 0.075, modern: r * 0.26, 'f1-13': r * 0.46, 'f1-18': r * 0.34, kart: r * 0.42 }[style] ?? r * 0.3;
  const ri = r - side, c = Math.min(side, w) * 0.4;
  const pts = [[ri * 0.97, -w / 2], [r - c, -w / 2], [r, -w / 2 + c], [r, w / 2 - c], [r - c, w / 2], [ri * 0.97, w / 2]].map(p => new THREE.Vector2(p[0], p[1]));
  const tg = new THREE.LatheGeometry(pts, 72); tg.rotateX(Math.PI / 2);
  g.add(mk(tg, style.startsWith('f1') || style === 'kart' ? M.slick : M.tire));
  if (o.stripe) { const s = mk(new THREE.TorusGeometry((ri + r) / 2, 0.008, 6, 48), M.paint(o.stripe)); s.position.z = w / 2; g.add(s); }
  const spokes = (n, len, thick, depth, mat, z, r0) => {
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      const s = box(len, thick, depth, mat, Math.cos(a) * (r0 + len / 2), Math.sin(a) * (r0 + len / 2), z);
      s.rotation.z = a; g.add(s);
    }
  };
  if (style === 'artillery') {
    g.add(mk(new THREE.TorusGeometry(ri - 0.015, 0.025, 8, 40), M.wood));
    g.add(cylZ(0.07, w + 0.05, M.brass, 0, 0, 0));
    spokes(12, ri - 0.09, 0.035, 0.035, M.wood, 0, 0.06);
  } else if (style === 'wire') {
    g.add(mk(new THREE.TorusGeometry(ri - 0.01, 0.018, 8, 40), M.chrome));
    g.add(cylZ(0.05, w + 0.06, M.chrome, 0, 0, 0));
    for (let i = 0; i < 28; i++) {
      const a = i / 28 * Math.PI * 2, zz = (i % 2 ? 1 : -1) * w * 0.35;
      g.add(rod(V3(Math.cos(a) * 0.045, Math.sin(a) * 0.045, zz), V3(Math.cos(a + 0.2) * (ri - 0.02), Math.sin(a + 0.2) * (ri - 0.02), 0), 0.0045, M.chrome));
    }
  } else if (style === 'disc') {
    g.add(cylZ(ri, w * 0.9, M.dark, 0, 0, 0, 32));
    g.add(mk(new THREE.TorusGeometry(ri * 0.92, 0.018, 8, 40), M.chrome));
    const cap = mk(new THREE.SphereGeometry(ri * 0.62, 24, 12), M.chrome); cap.scale.z = 0.3; cap.position.z = w * 0.42; g.add(cap);
  } else {
    // Alloy / modern / F1 / kart rims with spokes, brake disc and caliper
    const rimMat = style === 'alloy8' || style === 'kart' ? M.alu : (style === 'alloy' ? M.alu : M.rimDark);
    g.add(cylZ(ri, w * 0.9, rimMat, 0, 0, -0.005, 32));
    g.add(cylZ(ri * 0.93, w * 0.92, M.dark, 0, 0, 0, 32));
    const n = style === 'alloy8' ? 8 : style === 'alloy' ? 5 : style === 'modern' ? 10 : style === 'kart' ? 6 : 12;
    if (style !== 'f1-18') spokes(n, ri * 0.82, style === 'alloy' ? 0.07 : 0.04, 0.03, rimMat, w * 0.4, ri * 0.12);
    g.add(cylZ(ri * 0.16, w * 0.9 + 0.02, rimMat, 0, 0, 0));
    if (style === 'f1-18') { // aero wheel cover
      g.add(cylZ(ri * 0.94, 0.01, M.carbon, 0, 0, w * 0.46, 32));
      const t = mk(new THREE.TorusGeometry(ri * 0.7, 0.012, 6, 40), M.paint(o.stripe || 0xffcc00)); t.position.z = w * 0.47; g.add(t);
    }
    if (style !== 'kart' && ri > 0.12) {
      g.add(cylZ(ri * 0.72, 0.025, M.disc, 0, 0, -w * 0.12, 32));
      const cal = box(0.07, 0.14, 0.07, M.paint(o.caliper ?? 0xd01818), ri * 0.62 * Math.cos(0.6), ri * 0.62 * Math.sin(0.6), -w * 0.12);
      cal.rotation.z = 0.6 + Math.PI / 2; g.add(cal);
    }
  }
  return g;
}

/* ---------- Engines (sit roughly in a 0.8 x 0.5 x 0.6 box, origin at crank) ---------- */
function makeEngine(kind, accent = 0xb3211e) {
  const g = new THREE.Group(), al = M.engine, red = M.paint(accent);
  const turbo = (x, y, z) => { const t = mk(new THREE.TorusGeometry(0.06, 0.035, 10, 20), M.alu, x, y, z); t.rotation.y = Math.PI / 2; g.add(t); g.add(cylX(0.03, 0.12, M.copper, x - 0.08, y, z)); };
  const battery = (y = -0.12) => { g.add(box(0.95, 0.1, 0.6, M.dark, -0.1, y, 0)); for (let i = 0; i < 4; i++) g.add(box(0.9, 0.012, 0.03, M.glowCyan, -0.1, y + 0.056, -0.21 + i * 0.14)); };
  const motor = (x, y, z) => { g.add(cylZ(0.11, 0.2, M.copper, x, y, z)); g.add(cylZ(0.115, 0.05, M.alu, x, y, z + 0.1)); };
  const inline = n => {
    const len = n * 0.1 + 0.12;
    g.add(box(len, 0.3, 0.24, al, 0, 0, 0));
    g.add(rbox(len * 0.95, 0.08, 0.2, 0.03, red, 0, 0.19, 0));
    g.add(box(len * 0.8, 0.08, 0.2, M.dark, 0, -0.19, 0));
    for (let i = 0; i < n; i++) g.add(cylZ(0.022, 0.16, M.chrome, -len / 2 + 0.11 + i * 0.1, 0.1, 0.18));
  };
  const vee = (n, ang = 0.5, cover = red) => {
    const per = n / 2, len = per * 0.11 + 0.14;
    g.add(box(len, 0.22, 0.26, al, 0, -0.04, 0));
    [-1, 1].forEach(sd => {
      const bank = new THREE.Group();
      bank.add(box(len, 0.2, 0.17, al, 0, 0.1, 0));
      bank.add(rbox(len * 0.96, 0.06, 0.15, 0.025, cover, 0, 0.23, 0));
      bank.position.set(0, 0.06, sd * 0.09); bank.rotation.x = sd * ang; g.add(bank);
    });
    for (let i = 0; i < per; i++) g.add(cylY(0.026, 0.14, M.chrome, -len / 2 + 0.12 + i * 0.11, 0.26, 0));
    return len;
  };
  const flat = n => {
    const per = n / 2, len = per * 0.11 + 0.14;
    g.add(box(len, 0.24, 0.24, al, 0, 0, 0));
    [-1, 1].forEach(sd => { g.add(box(len, 0.16, 0.2, al, 0, 0, sd * 0.2)); g.add(rbox(len * 0.95, 0.12, 0.05, 0.02, M.dark, 0, 0, sd * 0.32)); });
    return len;
  };
  switch (kind) {
    case 'single': {
      g.add(box(0.26, 0.2, 0.22, al, 0, 0, 0));
      for (let i = 0; i < 6; i++) g.add(cylY(0.09 - i * 0.004, 0.012, M.dark, 0, 0.13 + i * 0.03, 0));
      g.add(cylZ(0.2, 0.04, M.dark, 0, 0, 0.2, 32));
      break;
    }
    case 'I4': inline(4); break;
    case 'I6': inline(6); break;
    case 'I8': inline(8); break;
    case 'V8': vee(8); break;
    case 'V8tt': { const l = vee(8); turbo(-l / 2 - 0.05, 0.05, 0.25); turbo(-l / 2 - 0.05, 0.05, -0.25); break; }
    case 'V6t': { const l = vee(6, 0.5, M.dark); turbo(-l / 2 - 0.06, 0.06, 0.22); turbo(-l / 2 - 0.06, 0.06, -0.22); break; }
    case 'V10': vee(10, 0.6); break;
    case 'V12': vee(12); break;
    case 'W16': { const l = vee(16, 0.75, M.dark); [-0.28, 0.28].forEach(z => { turbo(-l / 2, 0.15, z); turbo(l / 2 - 0.1, 0.15, z); }); g.scale.setScalar(0.85); break; }
    case 'flat4': flat(4); g.add(cylZ(0.16, 0.05, M.dark, 0.1, 0.22, 0)); break;
    case 'flat12': { flat(12); const fan = cylY(0.2, 0.06, M.dark, 0, 0.2, 0, 32); g.add(fan); spin.push(fan); break; }
    case 'rotary': for (let i = 0; i < 4; i++) { g.add(cylX(0.17, 0.09, al, -0.18 + i * 0.12, 0, 0, 32)); g.add(cylY(0.03, 0.18, M.chrome, -0.18 + i * 0.12, 0.2, 0)); } g.add(box(0.5, 0.06, 0.06, M.dark, 0, 0.3, 0)); break;
    case 'electric': battery(-0.05); motor(-0.35, 0.12, 0.15); motor(0.25, 0.12, -0.15); break;
    case 'hybridV8': vee(8, 0.5, M.dark); battery(-0.22); motor(0.5, 0, 0); break;
    case 'hybridV4': vee(4, 0.5, M.dark); turbo(-0.25, 0.05, 0.2); battery(-0.2); motor(0.4, 0, 0); break;
    case 'V6hybrid': { const l = vee(6, 0.5, M.dark); turbo(-l / 2 - 0.05, 0.08, 0); motor(0.25, -0.05, 0.2); battery(-0.18); break; }
    default: inline(4);
  }
  return g;
}

/* ---------- Kit: collects named parts; each part has one or more groups with an explode direction ---------- */
const spin = []; // meshes that spin continuously (fans)
class Kit {
  constructor() { this.root = new THREE.Group(); this.parts = []; }
  part(name, info, dir) {
    const g = new THREE.Group(); g.userData.dir = V3(...dir); this.root.add(g);
    let p = this.parts.find(p => p.name === name);
    if (!p) { p = { name, info, objs: [] }; this.parts.push(p); }
    p.objs.push(g); return g;
  }
  finish() {
    this.root.updateMatrixWorld(true);
    const b = new THREE.Box3(), c = V3();
    this.parts = this.parts.filter(p => p.objs.some(o => o.children.length));
    this.parts.forEach(p => p.objs.forEach(g => {
      b.setFromObject(g);
      if (!b.isEmpty()) { b.getCenter(c); g.children.forEach(ch => ch.position.sub(c)); g.position.add(c); }
      g.userData.home = g.position.clone();
      g.userData.spin = V3(rand(-0.3, 0.3), rand(-0.4, 0.4), rand(-0.3, 0.3));
      g.userData.k = 0;
    }));
    this.root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    this.objs = this.parts.flatMap(p => p.objs);
    const bb = new THREE.Box3().setFromObject(this.root), sz = V3(); bb.getSize(sz);
    this.size = Math.max(sz.x, sz.z); this.h = sz.y;
    return this;
  }
}

/* =====================================================================
   4. PROCEDURAL CAR BUILDERS
   ===================================================================== */
function addWheels(kit, car, list, r, w, style, o) {
  list.forEach(([x, z, rr, ww]) => {
    const sd = Math.sign(z);
    const p = kit.part('Wheels & tyres', INFO.wheels(car), [x > 0 ? 0.5 : -0.5, 0.25, sd * 1.3]);
    const wh = makeWheel(rr || r, ww || w, style, o);
    if (sd < 0) wh.rotation.y = Math.PI;
    wh.position.set(x, rr || r, z); p.add(wh);
  });
}
function fender(R, a0, a1, depth, mat) {
  const s = new THREE.Shape();
  s.absarc(0, 0, R + 0.05, a0, a1, false); s.absarc(0, 0, R, a1, a0, true); s.closePath();
  return mk(extrude(s, depth, 0.015), mat);
}

/* --- Profile-extruded cars: vintage coupés, supercars, prototypes, limousines --- */
function buildProfile(kit, car, b) {
  const { L, W, H, wr, wb } = b, g = b.g ?? 0.14, ww = b.ww ?? (wr < 0.3 ? 0.18 : 0.27), cab = b.cab;
  const fx = wb / 2, rx = -wb / 2, bev = 0.06;
  const paint = M.paint(car.color), bw = b.classic ? W * 0.62 : W;
  const fH = b.classic ? b.noseH : Math.max(b.fH ?? H, 2 * wr + 0.17);
  const rH = b.classic ? b.deckH : Math.max(b.rH ?? b.deckH, 2 * wr + 0.17);

  // Side profile with wheel arches, extruded across the width
  const s = new THREE.Shape(); s.moveTo(-L / 2 + 0.14, g);
  if (!b.classic) {
    const ar = wr + 0.035 + bev;
    s.lineTo(rx - ar, g); s.absarc(rx, wr, ar, Math.PI, 0, true); s.lineTo(rx + ar, g);
    s.lineTo(fx - ar, g); s.absarc(fx, wr, ar, Math.PI, 0, true); s.lineTo(fx + ar, g);
  }
  s.lineTo(L / 2 - 0.14, g);
  const pts = [[L / 2 - 0.01, g + (b.noseH - g) * 0.45], [L / 2 - 0.12, b.noseH], [fx, fH], [cab.s, H], [cab.e, b.deckH], [rx, rH], [-L / 2 + 0.12, b.tailH], [-L / 2, g + (b.tailH - g) * 0.45]];
  pts.sort((a, c) => c[0] - a[0]);
  const P = []; pts.forEach(p => { if (!P.length || P[P.length - 1][0] - p[0] > 0.08) P.push(p); });
  s.splineThru(P.map(p => new THREE.Vector2(p[0], p[1])));
  s.closePath();
  /* The body is hollow where people sit: a centre "tub" whose top drops to floor level inside the
     cabin, closed by two full-profile side slabs (the doors). */
  const arc = wr + 0.035 + bev, yf = g + 0.1, t = 0.1;
  const ex = b.engPos === 'front' ? fx - 0.5 : b.engPos === 'mid' ? rx + 0.75 : rx - 0.2;
  const ds = b.classic ? cab.s : Math.min(cab.s, fx - arc - 0.05);
  let de = b.classic ? cab.e : Math.max(cab.e, rx + arc + 0.05);
  if (b.engPos === 'mid') de = Math.max(de, ex + 0.45);
  de = Math.min(de, ds - 0.95);
  const v2 = p => new THREE.Vector2(p[0], p[1]);
  const tub = new THREE.Shape(); tub.moveTo(-L / 2 + 0.14, g);
  if (!b.classic) { tub.lineTo(rx - arc, g); tub.absarc(rx, wr, arc, Math.PI, 0, true); tub.lineTo(rx + arc, g); tub.lineTo(fx - arc, g); tub.absarc(fx, wr, arc, Math.PI, 0, true); tub.lineTo(fx + arc, g); }
  tub.lineTo(L / 2 - 0.14, g);
  tub.splineThru(P.filter(p => p[0] > ds + 0.08).concat([[ds, H]]).map(v2));
  tub.lineTo(ds, yf); tub.lineTo(de, yf); tub.lineTo(de, b.deckH);
  const rearPts = P.filter(p => p[0] < de - 0.08);
  if (rearPts.length) tub.splineThru(rearPts.map(v2));
  tub.closePath();
  const midD = bw - 2 * t;
  const midGeo = new THREE.ExtrudeGeometry(tub, { depth: midD, bevelEnabled: true, bevelThickness: 0.001, bevelSize: bev, bevelSegments: 1, curveSegments: 64 });
  midGeo.translate(0, 0, -midD / 2);
  const sideD = t - 0.07;
  const sideGeo = new THREE.ExtrudeGeometry(s, { depth: sideD, bevelEnabled: true, bevelThickness: 0.07, bevelSize: bev, bevelSegments: 8, curveSegments: 64 });
  const body = kit.part('Body shell', INFO.body(car), [0, 1.9, 0]);
  body.add(mk(midGeo, paint));
  [-1, 1].forEach(sd => { const m = mk(sideGeo, paint); m.position.z = sd > 0 ? bw / 2 - t : -(bw / 2 - 0.07); body.add(m); });
  if (b.num) [-1, 1].forEach(sd => { const d = decal(b.num, b.ring, 0.42); d.position.set((cab.s + cab.e) / 2, g + (H - g) * 0.5, sd * (bw / 2 + 0.004)); if (sd < 0) d.rotation.y = Math.PI; body.add(d); });

  // Panel gaps (door shut lines) and side mirrors — small details that sell realism
  const seam = std({ color: 0x050505, roughness: 0.9 });
  [-1, 1].forEach(sd => {
    [cab.s - 0.05, cab.e + 0.12].forEach(x => body.add(box(0.008, (H - g) * 0.62, 0.004, seam, x, g + (H - g) * 0.5, sd * (bw / 2 + 0.002))));
    if (!b.classic && car.year > 1950) {
      const mz = sd * (bw * (cab.cw ?? 0.8) / 2 + 0.09);
      body.add(rod(V3(cab.s - 0.08, H + 0.02, sd * (bw * (cab.cw ?? 0.8) / 2 - 0.02)), V3(cab.s - 0.1, H + 0.1, mz), 0.012, M.dark));
      body.add(rbox(0.07, 0.08, 0.13, 0.025, paint, cab.s - 0.12, H + 0.12, mz));
    }
  });

  // Glasshouse + roof
  if (!b.roadster) {
    const cw = bw * (cab.cw ?? 0.8);
    let fr = cab.s - cab.rf, re = cab.e + cab.rr;
    if (fr - re < 0.3) { const m = (fr + re) / 2; fr = m + 0.15; re = m - 0.15; }
    const c = new THREE.Shape();
    c.moveTo(cab.s + 0.05, H - 0.1); c.lineTo(fr + 0.06, cab.roof - 0.03);
    c.quadraticCurveTo(fr, cab.roof, fr - 0.1, cab.roof); c.lineTo(re + 0.1, cab.roof);
    c.quadraticCurveTo(re, cab.roof, re - 0.05, cab.roof - 0.03); c.lineTo(cab.e - 0.05, b.deckH - 0.1); c.closePath();
    const cabG = kit.part('Glasshouse & roof', INFO.cabin, [0, 3.0, 0]);
    cabG.add(mk(extrude(c, cw - 0.1, 0.05, 12), M.glass));
    cabG.add(rbox(fr - re + 0.08, 0.06, cw - 0.04, 0.025, b.roofColor ? M.paint(b.roofColor) : paint, (fr + re) / 2, cab.roof + 0.03, 0));
    const lux = car.cat === 'luxury' && car.year > 2000;
    const head = mk(new THREE.PlaneGeometry(fr - re + 0.02, cw - 0.16), lux ? M.starlight : M.headliner, (fr + re) / 2, cab.roof - 0.005, 0);
    head.rotation.x = Math.PI / 2; cabG.add(head);
    cabG.add(rbox(0.03, 0.06, 0.22, 0.015, M.dark, fr - 0.06, cab.roof - 0.07, 0));
    [-1, 1].forEach(sd => {
      cabG.add(rod(V3(cab.s, H - 0.04, sd * (cw / 2 - 0.02)), V3(fr, cab.roof, sd * (cw / 2 - 0.04)), 0.025, paint));
      cabG.add(rod(V3(cab.e, b.deckH - 0.04, sd * (cw / 2 - 0.02)), V3(re, cab.roof, sd * (cw / 2 - 0.04)), 0.03, paint));
    });
  } else {
    const ws = kit.part('Windscreen', INFO.windscreen, [0.5, 2.4, 0]);
    const sc = box(0.02, 0.3, bw * 0.72, M.glass, cab.s, H + 0.12, 0); sc.rotation.z = 0.45; ws.add(sc);
    ws.add(rod(V3(cab.s - 0.07, H + 0.26, -bw * 0.36), V3(cab.s - 0.07, H + 0.26, bw * 0.36), 0.012, M.chrome));
  }

  // Interior (seats, dashboard, wheel, console, trim)
  const sx = Math.max(ds - 0.95, de + 0.4), sy = yf + 0.14;
  const seatZ = b.central ? [0] : [bw * 0.21, -bw * 0.21];
  buildInterior(kit, car, b, { sx, sy, yf, ds, de, bw, seatZ, H, L });
  kit.cockpit = { eye: V3(sx - 0.2, Math.min(sy + 0.7, (b.roadster ? 9 : cab.roof) - 0.1), seatZ[0]), dir: V3(1, -0.12, -seatZ[0] * 0.15) };

  // Engine
  const eng = kit.part('Engine', `${car.specs.engine}. ${ENG[b.eng] || ''}`, [0, 0.95, 0]);
  const e = makeEngine(b.eng, b.engAccent ?? 0xb3211e); e.position.set(ex, g + 0.24, 0); eng.add(e);

  // Chassis
  const ch = kit.part('Chassis & suspension', INFO.chassis, [0, 0, 0]);
  ch.add(box(L * 0.72, 0.05, bw * 0.7, M.dark, 0, g + 0.03, 0));
  [fx, rx].forEach(x => {
    ch.add(cylZ(0.03, W - 0.3, M.dark, x, wr, 0));
    [-1, 1].forEach(sd => ch.add(cylY(0.055, 0.3, M.paint(0xd4a017), x, wr + 0.12, sd * (W / 2 - 0.38), 12)));
  });

  // Wheels
  const tz = b.classic ? W / 2 - ww / 2 : W / 2 - ww / 2 - 0.03;
  addWheels(kit, car, [[fx, tz], [fx, -tz], [rx, tz], [rx, -tz]], wr, ww, b.wheel || 'alloy', { caliper: b.caliper });

  // Lights
  const hl = kit.part('Headlights', INFO.head, [1.5, 0.45, 0]);
  const ly = b.noseH - 0.08, lx = L / 2 - 0.06, lz = bw * 0.33;
  [-1, 1].forEach(sd => {
    if (b.lights === 'slim') { const m = box(0.05, 0.05, bw * 0.2, M.headlight, lx - 0.04, ly + 0.03, sd * lz); m.rotation.y = sd * 0.2; hl.add(m); }
    else if (b.lights === 'classic') {
      const y = 2 * wr + 0.12, x = fx + 0.15, z = sd * (bw / 2 + 0.1);
      const bowl = mk(new THREE.SphereGeometry(0.14, 20, 14), M.chrome, x, y, z); bowl.scale.x = 0.7; hl.add(bowl);
      hl.add(cylX(0.12, 0.03, M.headlight, x + 0.09, y, z)); hl.add(rod(V3(x, y - 0.1, z), V3(x - 0.05, b.noseH - 0.25, sd * bw * 0.3), 0.015, M.chrome));
    } else {
      const zz = b.quad ? [lz, lz - 0.2] : [lz];
      zz.forEach(z => { hl.add(cylX(0.085, 0.06, M.chrome, lx, ly, sd * z)); hl.add(cylX(0.07, 0.07, M.headlight, lx + 0.005, ly, sd * z)); });
    }
  });
  const tl = kit.part('Tail lights', INFO.tail, [-1.5, 0.45, 0]);
  if (b.lightbar) tl.add(box(0.04, 0.035, bw * 0.82, M.taillight, -L / 2 + 0.04, b.tailH - 0.08, 0));
  else [-1, 1].forEach(sd => tl.add(box(0.05, 0.08, bw * 0.18, M.taillight, -L / 2 + 0.03, b.tailH - 0.1, sd * bw * 0.33)));

  // Grille / intakes
  if (b.grille !== 'none') {
    const gr = kit.part('Grille & intakes', INFO.grille, [1.8, 0.15, 0]);
    const gx = L / 2 - 0.02;
    if (b.grille === 'rr') {
      gr.add(box(0.1, 0.42, bw * 0.3, M.chrome, gx - 0.04, b.noseH - 0.22, 0));
      for (let i = 0; i < 8; i++) gr.add(box(0.11, 0.36, 0.01, M.dark, gx - 0.035, b.noseH - 0.22, -bw * 0.13 + i * bw * 0.037));
      gr.add(mk(new THREE.ConeGeometry(0.03, 0.12, 8), M.chrome, gx - 0.06, b.noseH + 0.05, 0));
    } else if (b.grille === 'merc') {
      gr.add(box(0.08, 0.24, bw * 0.4, M.chrome, gx - 0.03, b.noseH - 0.2, 0));
      gr.add(box(0.085, 0.2, bw * 0.36, M.dark, gx - 0.03, b.noseH - 0.2, 0));
      const st = mk(new THREE.TorusGeometry(0.06, 0.008, 6, 24), M.chrome, gx - 0.01, b.noseH - 0.2, 0); st.rotation.y = Math.PI / 2; gr.add(st);
    } else if (b.grille === 'horseshoe') {
      const t = mk(new THREE.TorusGeometry(0.15, 0.022, 10, 40), M.chrome, gx - 0.02, g + 0.24, 0); t.rotation.y = Math.PI / 2; t.scale.y = 1.25; gr.add(t);
      const d = cylX(0.14, 0.03, M.dark, gx - 0.03, g + 0.24, 0, 32); d.scale.set(1, 1.25, 1); gr.add(d);
      [-1, 1].forEach(sd => gr.add(box(0.06, 0.1, bw * 0.22, M.dark, gx - 0.05, g + 0.14, sd * bw * 0.3)));
    } else if (b.grille === 'classic') {
      const gh = b.noseH - g - 0.12;
      gr.add(box(0.08, gh, bw * 0.62, M.chrome, L / 2 + 0.02, g + 0.06 + gh / 2, 0));
      gr.add(box(0.09, gh - 0.08, bw * 0.54, M.dark, L / 2 + 0.02, g + 0.06 + gh / 2, 0));
      for (let i = 0; i < 9; i++) gr.add(box(0.1, gh - 0.1, 0.012, M.chrome, L / 2 + 0.02, g + 0.06 + gh / 2, -bw * 0.24 + i * bw * 0.06));
    } else if (b.grille === 'chrome' || b.grille === 'oval' || b.grille === 'mini') {
      const gh = b.grille === 'chrome' ? 0.2 : 0.16, gwid = b.grille === 'chrome' ? bw * 0.8 : bw * 0.36;
      gr.add(box(0.06, gh, gwid, M.chrome, gx - 0.03, g + 0.25, 0));
      gr.add(box(0.07, gh - 0.04, gwid - 0.04, M.dark, gx - 0.03, g + 0.25, 0));
    } else gr.add(box(0.08, 0.14, bw * 0.62, M.dark, gx - 0.07, g + 0.14, 0));
  }

  // Classic fenders + running boards
  if (b.classic) {
    const fm = M.paint(b.fenderColor ?? car.color), R = wr + 0.08;
    [-1, 1].forEach(sd => {
      const fp = kit.part('Fenders & running boards', INFO.fenders, [0, 0.6, sd * 1.1]);
      const f1 = fender(R, -0.35, Math.PI, ww + 0.14, fm); f1.position.set(fx, wr, sd * tz); fp.add(f1);
      const f2 = fender(R, 0, Math.PI + 0.35, ww + 0.14, fm); f2.position.set(rx, wr, sd * tz); fp.add(f2);
      fp.add(box((fx - R) - (rx + R), 0.04, ww + 0.14, M.rubber, (fx + rx) / 2, wr - 0.02, sd * tz));
    });
  }
  // Chrome bumpers for older road cars
  if (b.bumpers || b.classic) {
    [1, -1].forEach(sd => { const bp = kit.part('Chrome bumpers', INFO.bumpers, [sd * 1.9, 0.1, 0]); bp.add(rbox(0.1, 0.1, bw * 0.95, 0.045, M.chrome, sd * (L / 2 + 0.04), b.classic ? wr : g + 0.14, 0)); });
  }
  // Tailfins
  if (b.fins) {
    [-1, 1].forEach(sd => {
      const fp = kit.part('Tail fins', INFO.fins, [-0.6, 1.3, sd * 0.7]);
      const fs = new THREE.Shape(); fs.moveTo(-L / 2 + 0.02, b.tailH - 0.04); fs.lineTo(-L / 2 + 0.08, b.tailH + 0.34); fs.quadraticCurveTo(-L / 2 + 0.6, b.tailH + 0.1, -L / 2 + 1.5, b.tailH); fs.closePath();
      fp.add(mk(extrude(fs, 0.05, 0.015), paint, 0, 0, sd * (bw / 2 - 0.12)));
      [0.2, 0.1].forEach(dy => { const bl = mk(new THREE.ConeGeometry(0.035, 0.12, 12), M.taillight, -L / 2 + 0.04, b.tailH + dy, sd * (bw / 2 - 0.12)); bl.rotation.z = Math.PI / 2; fp.add(bl); });
    });
  }
  // Rear wing (+ shark fin)
  if (b.wing) {
    const wgp = kit.part('Rear wing', INFO.wing, [-1.0, 1.6, 0]);
    const { x, h } = b.wing;
    const plane = rbox(0.34, 0.03, bw * 0.86, 0.012, paint, x, h, 0); plane.rotation.z = -0.12; wgp.add(plane);
    [-1, 1].forEach(sd => {
      wgp.add(box(0.4, 0.2, 0.02, M.carbon, x, h - 0.05, sd * bw * 0.43));
      wgp.add(rod(V3(x + 0.05, h, sd * bw * 0.25), V3(x + 0.15, b.tailH - 0.05, sd * bw * 0.25), 0.02, M.carbon));
    });
    if (b.fin) wgp.add(box(1.1, 0.26, 0.02, paint, -1.0, b.deckH + 0.1, 0));
  }
  // Exhaust
  if (b.eng !== 'electric') {
    const exg = kit.part('Exhaust', INFO.exhaust, [-1.7, 0.05, 0]);
    [-1, 1].forEach(sd => exg.add(cylX(0.045, 0.3, M.chrome, -L / 2 + 0.04, g + 0.1, sd * bw * 0.22)));
  }
}

  en.add(cylX(0.1, 0.42, M.engine, rx - 0.05, 0.62, 0)); en.add(box(0.2, 0.18, 0.2, M.engine, rx - 0.3, 0.6, 0));
  en.add(cylY(0.3, 0.04, M.dark, rx - 0.35, 0.82, 0, 40)); en.add(cylY(0.04, 0.2, M.brass, rx - 0.35, 0.74, 0));

  const dr = kit.part('Belt & chain drive', 'A leather belt worked as clutch; chains drove each rear wheel.', [0, -0.05, 0.9]);
  dr.add(cylZ(0.1, 0.06, M.dark, rx + 0.2, 0.55, 0.36)); dr.add(cylZ(0.06, 0.9, M.dark, rx + 0.2, 0.55, 0));
  [-1, 1].forEach(sd => dr.add(box(0.36, 0.015, 0.02, M.dark, rx + 0.1, 0.51, sd * 0.5)));
  const se = kit.part('Bench seat', 'A buttoned leather bench for two — perched high like a carriage.', [0.1, 1.6, 0]);
  se.add(box(0.48, 0.28, 0.9, M.wood, 0.05, 0.68, 0)); se.add(rbox(0.42, 0.12, 0.9, 0.04, M.leather, 0.05, 0.88, 0));
  const back = rbox(0.07, 0.32, 0.9, 0.03, M.leather, -0.17, 1.06, 0); back.rotation.z = 0.15; se.add(back);

/* --- Early "horseless carriages": Velo, Curved Dash, Model T, Silver Ghost --- */
function buildHorseless(kit, car, b) {
  const paint = M.paint(car.color), { L, W, wrF: wf, wrR: wrr } = b, fx = L / 2 - 0.42, rx = -L / 2 + 0.5, tz = W / 2 - 0.06;
  const cy = Math.min(wf, wrr) + 0.1, bw = W * 0.74;
  const ch = kit.part('Chassis & leaf springs', 'A ladder frame of steel rails on leaf springs — straight from carriage-building tradition.', [0, 0, 0]);
  [-1, 1].forEach(sd => {
    ch.add(box(L * 0.84, 0.08, 0.06, M.dark, 0, cy, sd * W * 0.3));
    ch.add(rbox(0.6, 0.04, 0.07, 0.015, M.dark, fx, wf + 0.08, sd * W * 0.3));
    ch.add(rbox(0.6, 0.04, 0.07, 0.015, M.dark, rx, wrr + 0.08, sd * W * 0.3));
  });
  ch.add(cylZ(0.03, W - 0.1, M.dark, fx, wf, 0)); ch.add(cylZ(0.03, W - 0.1, M.dark, rx, wrr, 0));
  [[fx, wf, 1], [fx, wf, -1], [rx, wrr, 1], [rx, wrr, -1]].forEach(([x, r, sd]) => {
    const p = kit.part('Wheels', INFO.wheels(car), [x > 0 ? 0.4 : -0.4, 0.2, sd * 1.15]);
    const w = makeWheel(r, 0.07, b.wheel); if (sd < 0) w.rotation.y = Math.PI; w.position.set(x, r, sd * tz); p.add(w);
  });
  const body = kit.part('Coachwork', 'Wooden-framed body panels, painted and varnished by hand like a horse carriage.', [0, 1.7, 0]);
  const seats = kit.part('Seats', 'Deep-buttoned leather benches — comfort borrowed from Victorian carriages.', [0, 1.1, 0]);
  const eng = kit.part('Engine', `${car.specs.engine}. ${ENG[b.eng]}`, [0, 0.9, 0]);
  const st = kit.part('Steering', 'Early drivers steered with a tiller or a column-mounted wheel.', [0.6, 1.3, 0]);
  const lamps = kit.part('Lamps', 'Brass oil or acetylene lamps — electric lighting arrived around 1912.', [1.3, 0.6, 0]);
  if (b.body === 'tourer') {
    const hood = b.hood, cowl = fx - hood - 0.05, tubL = cowl - (rx - 0.4), tubX = cowl - tubL / 2;
    kit.cockpit = { eye: V3(cowl - 0.55, cy + 1.4, bw * 0.22), dir: V3(1, -0.25, 0) };
    const rad = kit.part('Radiator', 'A honeycomb radiator cools the engine — its shape became each brand\'s face.', [1.4, 0.3, 0]);
    rad.add(box(0.1, 0.52, 0.5, b.radiator === 'rr' ? M.chrome : M.brass, fx + 0.03, cy + 0.38, 0));
    rad.add(box(0.11, 0.4, 0.38, M.dark, fx + 0.03, cy + 0.37, 0));
    body.add(rbox(hood, 0.42, 0.52, 0.05, b.hoodMat === 'alu' ? M.alu : paint, fx - hood / 2 - 0.02, cy + 0.35, 0));
    body.add(box(0.06, 0.6, bw, paint, cowl, cy + 0.42, 0));
    body.add(rbox(tubL, 0.55, bw, 0.06, paint, tubX, cy + 0.38, 0));
    body.add(box(0.03, 0.42, bw * 0.9, M.glass, cowl - 0.04, cy + 0.92, 0));
    body.add(rod(V3(cowl - 0.04, cy + 1.13, -bw * 0.45), V3(cowl - 0.04, cy + 1.13, bw * 0.45), 0.015, M.brass));
    if (b.roof) {
      [cowl - 0.06, rx - 0.33].forEach(x => [-1, 1].forEach(sd => body.add(rod(V3(x, cy + 0.65, sd * bw / 2), V3(x, cy + 1.5, sd * bw / 2), 0.015, M.dark))));
      body.add(rbox(tubL + 0.1, 0.05, bw + 0.06, 0.02, M.dark, tubX, cy + 1.52, 0));
    }
    [-1, 1].forEach(sd => {
      const fp = kit.part('Fenders & running boards', INFO.fenders, [0, 0.5, sd * 1.0]);
      const R = wf + 0.07;
      const f1 = fender(R, -0.3, Math.PI * 0.95, 0.16, M.paint(0x111111)); f1.position.set(fx, wf, sd * tz); fp.add(f1);
      const f2 = fender(wrr + 0.07, 0.05, Math.PI + 0.3, 0.16, M.paint(0x111111)); f2.position.set(rx, wrr, sd * tz); fp.add(f2);
      fp.add(box((fx - R) - (rx + wrr + 0.07), 0.03, 0.2, M.wood, (fx - R + rx + wrr + 0.07) / 2, cy + 0.02, sd * tz));
    });
    [cowl - 0.45, rx + 0.05].forEach(x => {
      seats.add(rbox(0.45, 0.14, bw * 0.9, 0.05, M.leather, x, cy + 0.72, 0));
      const bk = rbox(0.1, 0.4, bw * 0.9, 0.04, M.leather, x - 0.22, cy + 0.95, 0); bk.rotation.z = 0.15; seats.add(bk);
    });
    const e = makeEngine(b.eng); e.scale.multiplyScalar(0.9); e.position.set(fx - hood / 2, cy + 0.25, 0); eng.add(e);
    const top = V3(cowl - 0.38, cy + 1.0, bw * 0.22);
    st.add(rod(V3(cowl - 0.05, cy + 0.3, bw * 0.22), top, 0.018, M.dark));
    st.add(orient(mk(new THREE.TorusGeometry(0.17, 0.018, 8, 28), M.wood, top.x, top.y, top.z), V3(-0.35, 0.7, 0)));
    [-1, 1].forEach(sd => {
      const bowl = mk(new THREE.SphereGeometry(0.11, 16, 12), M.brass, fx + 0.12, cy + 0.66, sd * 0.32); bowl.scale.x = 0.75; lamps.add(bowl);
      lamps.add(cylX(0.09, 0.03, M.headlight, fx + 0.19, cy + 0.66, sd * 0.32));
      lamps.add(box(0.08, 0.13, 0.08, M.brass, cowl + 0.02, cy + 0.82, sd * (bw / 2 + 0.05)));
    });
  } else {
    kit.cockpit = { eye: V3(rx + 0.35, cy + 1.3, 0.15), dir: V3(1, -0.3, 0) };
    body.add(rbox(1.0, 0.42, bw, 0.05, paint, rx + 0.38, cy + 0.3, 0));
    if (b.body === 'curved') {
      const ds = new THREE.Shape(); ds.moveTo(0, 0); ds.quadraticCurveTo(0.4, 0, 0.5, 0.45); ds.lineTo(0.44, 0.47); ds.quadraticCurveTo(0.34, 0.06, 0, 0.06); ds.closePath();
      body.add(mk(extrude(ds, bw * 0.9, 0.01), paint, rx + 0.88, cy + 0.1, 0));
      st.add(rod(V3(rx + 0.95, cy + 0.15, 0.15), V3(rx + 0.72, cy + 0.78, 0.15), 0.016, M.dark));
      st.add(cylZ(0.02, 0.18, M.wood, rx + 0.72, cy + 0.78, 0.15));
    } else {
      body.add(rbox(0.55, 0.3, bw * 0.9, 0.05, paint, fx - 0.2, cy + 0.22, 0));
      const top = V3(fx - 0.6, cy + 0.85, 0);
      st.add(rod(V3(fx - 0.5, cy + 0.15, 0), top, 0.016, M.dark));
      st.add(orient(mk(new THREE.TorusGeometry(0.12, 0.014, 8, 24), M.dark, top.x, top.y, top.z), V3(-0.3, 1, 0)));
    }
    body.add(box(fx - (rx + 0.88) + 0.1, 0.03, bw * 0.9, M.wood, (fx + rx + 0.88) / 2, cy + 0.1, 0));
    seats.add(rbox(0.5, 0.13, bw, 0.04, M.leather, rx + 0.4, cy + 0.58, 0));
    const bk = rbox(0.1, 0.38, bw, 0.04, M.leather, rx + 0.12, cy + 0.8, 0); bk.rotation.z = 0.15; seats.add(bk);
    const e = makeEngine('single'); e.position.set(rx + 0.3, cy + 0.2, 0); eng.add(e);
    [-1, 1].forEach(sd => { lamps.add(box(0.09, 0.14, 0.09, M.brass, rx + 0.9, cy + 0.5, sd * (bw / 2 + 0.06))); lamps.add(box(0.095, 0.07, 0.07, M.headlight, rx + 0.9, cy + 0.5, sd * (bw / 2 + 0.06))); });
  }
}

/* --- Cigar-bodied front-engined racers: Bugatti Type 35, Alfa 158, W196 --- */
function buildCigar(kit, car, b) {
  const { L, R, wr } = b, paint = M.paint(car.color, true), fx = L / 2 - 0.6, rx = fx - b.wb, tz = b.track / 2, cy = wr + 0.1, ys = 0.7;
  const rf = t => t < 0.15 ? R * (0.12 + t / 0.15 * 0.63) : t < 0.6 ? R * (0.75 + (t - 0.15) / 0.45 * 0.25) : R * (1 - (t - 0.6) / 0.4 * 0.22);
  const lathe = (t0, t1) => {
    const pts = [new THREE.Vector2(0.001, t0 * L)];
    for (let i = 0; i <= 24; i++) { const t = t0 + (t1 - t0) * i / 24; pts.push(new THREE.Vector2(rf(t), t * L)); }
    pts.push(new THREE.Vector2(0.001, t1 * L));
    const geo = new THREE.LatheGeometry(pts, 40); geo.rotateZ(-Math.PI / 2); geo.scale(1, ys, 1.05); geo.translate(-L / 2, cy, 0);
    return geo;
  };
  const bon = kit.part('Bonnet', 'Long louvred bonnet hiding a straight-eight engine.', [0.2, 1.5, 0]);
  bon.add(mk(lathe(0.56, 1), paint));
  const body = kit.part('Body & tail', 'Slim single-seat body tapering into a pointed tail that hides the fuel tank.', [-0.2, 0.9, 0]);
  body.add(mk(lathe(0, 0.56), paint));
  const xc = -0.15, tc = (xc + L / 2) / L;
  const hole = cylY(0.24, 0.05, M.dark, xc, cy + rf(tc) * ys - 0.015, 0, 32); hole.scale.x = 1.5; body.add(hole);
  if (b.num) [-1, 1].forEach(sd => { const d = decal(b.num, '#111', 0.34); const t = (-0.75 + L / 2) / L; d.position.set(-0.75, cy, sd * (rf(t) * 1.05 + 0.006)); if (sd < 0) d.rotation.y = Math.PI; body.add(d); });
  const ck = kit.part('Cockpit', 'Wooden-rimmed wheel, a small aero screen and no seat belts — racing was brutally dangerous.', [0, 2.2, 0]);
  const ty = cy + rf(tc) * ys;
  const swG = new THREE.Group(); swG.position.set(xc + 0.3, ty + 0.1, 0); swG.rotation.z = 0.5;
  const sw = mk(new THREE.TorusGeometry(0.17, 0.016, 8, 28), M.wood); sw.rotation.y = Math.PI / 2; swG.add(sw); ck.add(swG);
  const back = rbox(0.08, 0.3, 0.42, 0.03, M.leather, xc - 0.32, ty + 0.05, 0); back.rotation.z = 0.25; ck.add(back);
  kit.cockpit = { eye: V3(xc - 0.2, ty + 0.42, 0), dir: V3(1, -0.15, 0) };
  const ws = box(0.015, 0.12, 0.34, M.glass, xc + 0.42, ty + 0.06, 0); ws.rotation.z = 0.4; ck.add(ws);
  const en = kit.part('Engine', `${car.specs.engine}. ${ENG[b.eng]}`, [0.2, 0.75, 0]);
  const e = makeEngine(b.eng); e.scale.setScalar(0.8); e.position.set(fx - 0.6, cy - 0.05, 0); en.add(e);
  const gr = kit.part('Radiator grille', INFO.grille, [1.4, 0.1, 0]);
  const gx = L / 2 - 0.03, gy = cy;
  if (b.grille === 'horseshoe') {
    const t = mk(new THREE.TorusGeometry(rf(1) * 0.85, 0.02, 10, 40, Math.PI * 1.6), M.chrome, gx, gy + 0.02, 0); t.rotation.set(0, Math.PI / 2, Math.PI * 0.2 + Math.PI / 2); gr.add(t);
  } else { const t = mk(new THREE.TorusGeometry(rf(1) * 0.75, 0.02, 10, 40), M.chrome, gx, gy, 0); t.rotation.y = Math.PI / 2; t.scale.x = 0.7; gr.add(t); }

}

      x.strokeStyle = acc; x.beginPath(); x.arc(256, 150, 98, Math.PI * 0.8, Math.PI * 1.6); x.stroke();
      x.fillStyle = '#fff'; x.textAlign = 'center'; x.font = 'bold 62px Arial'; x.fillText('128', 256, 165);
      x.font = '18px Arial'; x.fillStyle = '#8aa'; x.fillText('km/h', 256, 194);

        x.lineWidth = 10; x.strokeStyle = '#8c8c8c'; x.stroke();

/* =====================================================================
   5. ANIMATION ENGINE (promise-based tweens, cancellable sequences)
   ===================================================================== */
const ease = {
  inOut: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  back: t => { const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  lin: t => t,
};
const anims = new Set();
let skipFlag = false;
function animate(dur, fn = () => {}, e = ease.inOut, skippable = false) {
  return new Promise(res => anims.add({ t0: performance.now(), dur, fn, e, res, skippable }));
}
const wait = ms => animate(ms, undefined, ease.lin, true);
function stepAnims(now) {
  for (const a of [...anims]) {
    let k = Math.min(1, (now - a.t0) / a.dur);

}
function cancelAnims() { const list = [...anims]; anims.clear(); list.forEach(a => a.res()); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function loadCar(idx) {
  const token = ++seq; cancelAnims(); skipFlag = false; running = true;
  exitInterior(false);
  current = idx; const car = CARS[idx];
  updateInfo(car); updateTimeline();
  if (carObj) { scene.remove(carObj.root); disposeCar(carObj); }
  carObj = buildCar(car); scene.add(carObj.root);
  setupTags();
  const objs = carObj.objs, n = objs.length;
  objs.forEach(o => { applyExplode(o, 3.2); o.scale.setScalar(0.001); });
  frameCamera(1.0, 1300);
  setPhase(`Unpacking ${carObj.parts.length} parts…`);
  // Phase 1: parts fly in from far away into the exploded view
  await animate(1300, t => objs.forEach((o, i) => {
    const tt = clamp(t * 1.5 - i / n * 0.5, 0, 1), e = ease.out(tt);
    applyExplode(o, 3.2 - 2.2 * e); o.scale.setScalar(Math.max(0.001, e));
  }), ease.lin, true);
  if (token !== seq) return;
  objs.forEach(o => { applyExplode(o, 1); o.scale.setScalar(1); });
  exploded = true; showTags(true);
  // Phase 2: explain each part in turn

      if (token !== seq || skipFlag) break;
      setActive(i); pulse(carObj.parts[i]);
      setPhase(`Part ${i + 1}/${carObj.parts.length} · ${carObj.parts[i].name}`);
      await wait(1900);
    }
  }
  if (token !== seq) return;
  setActive(-1);
  // Phase 3: fly back together
  await assemble(token);
}

async function assemble(token = ++seq) {
  if (!carObj) return;
  if (token !== seq) return;
  running = true; setActive(-1); showTags(false); setPhase('Assembling…');
  const objs = carObj.objs, n = objs.length, from = objs.map(o => o.userData.k);
  objs.forEach(o => o.scale.setScalar(1));
  frameCamera(0, 1600);
  await animate(1600, t => objs.forEach((o, i) => {
    const st = i / n * 0.45, tt = clamp((t - st) / 0.55, 0, 1);

async function explode() {

  const token = ++seq; cancelAnims(); running = true;
  const objs = carObj.objs, n = objs.length, from = objs.map(o => o.userData.k);

function searchCars(raw) {
  const s = raw.trim().toLowerCase(); if (!s) return [];
  const dec = s.match(/^(1[89]\d|20\d)0'?s$/), yr = /^\d{4}$/.test(s) ? +s : null;
  const tokens = s.split(/\s+/).filter(t => t.length > 1);
  return CARS.map(c => {
    const name = c.name.toLowerCase(), hay = `${name} ${CATS[c.cat].label} ${c.cat} ${c.specs.engine} ${c.year}`.toLowerCase();
    let sc = 0;
    if (name === s) sc += 100; else if (name.includes(s)) sc += 50;
    if (hay.includes(s)) sc += 20;
    if (CATS[c.cat].label.toLowerCase().startsWith(s) || c.cat === s) sc += 30;
    if (yr) { const d = Math.abs(c.year - yr); if (d === 0) sc += 80; else if (d <= 8) sc += 32 - d * 4; }
    if (dec && String(c.year).startsWith(dec[1])) sc += 60;
    tokens.forEach(t => { if (hay.includes(t)) sc += 8; });
    return { c, sc };
  }).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc || a.c.year - b.c.year).map(x => x.c);
}
function renderSuggest() {
  const v = q.value; results = searchCars(v).slice(0, 7); sel = 0;
  if (!v.trim()) { sug.classList.remove('on'); return; }
  sug.innerHTML = '';
  if (!results.length) {
    sug.innerHTML = '<div class="sg none">No cars match. Try a maker (“Ferrari”), category (“F1”, “karts”) or a decade (“1960s”).</div>';
  } else results.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'sg' + (i === sel ? ' sel' : '');
    d.innerHTML = `<i style="background:${CATS[c.cat].color}"></i><b></b><span>${c.year} · ${CATS[c.cat].label}</span>`;
    d.querySelector('b').textContent = c.name;
    d.onmousedown = e => { e.preventDefault(); pick(c); };
    sug.appendChild(d);
  });
  sug.classList.add('on');
}
q.addEventListener('input', renderSuggest);
q.addEventListener('focus', renderSuggest);
q.addEventListener('blur', () => setTimeout(() => sug.classList.remove('on'), 120));
q.addEventListener('keydown', e => {
  if (!results.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length;
    sug.querySelectorAll('.sg').forEach((d, i) => d.classList.toggle('sel', i === sel));
  } else if (e.key === 'Escape') { sug.classList.remove('on'); q.blur(); }
});
form.addEventListener('submit', e => {
  e.preventDefault();
  const v = q.value.trim(); if (!v) { q.focus(); return; }
  const r = searchCars(v);
  if (!r.length) { noResult(v); return; }
  pick(r[Math.min(sel, r.length - 1)] && results.length ? results[sel] : r[0]);
});
function noResult(v) {
  form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
  toast(`No cars found for “${v}”.<br><small style="color:var(--mut)">Try “Bugatti”, “1950s”, “F1”, “luxury” or “2023”.</small>`);
}
let toastT;
function toast(html) { const t = $('#toast'); t.innerHTML = html; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
function pick(car) {
  sug.classList.remove('on'); q.blur();
  if (filter !== 'all' && car.cat !== filter) catNav.querySelector('[data-k="all"]').click();
  shatterSearch(car, q.value.trim() || car.name);
}

/* The signature search effect: the bar shatters while explaining itself, the shards
   fly into the stage to become the car, then the bar re-forms. */
async function shatterSearch(car, query) {
  if (shattering) { loadCar(CARS.indexOf(car)); return; }
  shattering = true;
  document.documentElement.style.setProperty('--acc', CATS[car.cat].color);
  const r = form.getBoundingClientRect(), cols = innerWidth < 600 ? 6 : 10, rows = 2;
  const words = ['CHASSIS', 'ENGINE', 'BODY', 'WHEELS', 'GLASS', 'LIGHTS', 'AERO', 'SEATS', 'AXLES', 'TYRES', 'GRILLE', 'EXHAUST'];
  const layer = $('#shards'); layer.innerHTML = '';
  const w = r.width / cols, h = r.height / rows, shards = [];
  for (let row = 0; row < rows; row++) for (let c = 0; c < cols; c++) {
    const d = document.createElement('div'); d.className = 'shard';
    Object.assign(d.style, { left: r.left + c * w + 'px', top: r.top + row * h + 'px', width: w + 1 + 'px', height: h + 1 + 'px',
      borderRadius: `${row === 0 && c === 0 ? 14 : 0}px ${row === 0 && c === cols - 1 ? 14 : 0}px ${row === 1 && c === cols - 1 ? 14 : 0}px ${row === 1 && c === 0 ? 14 : 0}px` });
    d.textContent = words[(c + row * cols) % words.length];
    d._x = r.left + c * w + w / 2; d._y = r.top + row * h + h / 2;
    layer.appendChild(d); shards.push(d);
  }
  form.classList.add('ghost'); $('#cats').classList.add('hide');
  const ex = $('#explain'); ex.innerHTML = ''; ex.classList.add('on');
  const say = html => { const div = document.createElement('div'); div.innerHTML = html; ex.appendChild(div); };
  const safe = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  say(`› query <b>"${safe(query)}"</b> received`);
  void layer.offsetWidth;
  // 1) burst apart
  shards.forEach(d => { d.style.transform = `translate(${rand(-170, 170)}px,${rand(40, 190)}px) rotate(${rand(-75, 75)}deg) scale(${rand(0.75, 1.1)})`; });
  await sleep(450); say('› breaking the search bar into components…');
  await sleep(450); say(`› match: <b>${safe(car.name)}</b> · ${car.year} · ${CATS[car.cat].label}`);
  // 2) shards fly into the stage centre and dissolve into the car
  const cx = innerWidth / 2, cy = innerHeight * 0.5;
  shards.forEach((d, i) => {
    d.style.transition = `transform .85s cubic-bezier(.6,0,.2,1) ${i * 18}ms, opacity .85s ${i * 18}ms`;
    d.style.transform = `translate(${cx - d._x}px,${cy - d._y}px) rotate(${rand(-360, 360)}deg) scale(.12)`; d.style.opacity = '0';
  });
  setTimeout(() => loadCar(CARS.indexOf(car)), 380);
  await sleep(500); say('› rebuilding the pieces into the car…');
  await sleep(1100);
  // 3) the bar re-forms from flying pieces
  shards.forEach(d => { d.style.transition = 'none'; d.style.opacity = '1'; d.style.transform = `translate(${rand(-240, 240)}px,${rand(80, 260)}px) rotate(${rand(-120, 120)}deg) scale(.4)`; });
  void layer.offsetWidth;
  shards.forEach((d, i) => { d.style.transition = `transform .75s cubic-bezier(.2,.9,.3,1.15) ${i * 15}ms, opacity .3s`; d.style.transform = 'none'; });
  await sleep(1050);
  form.classList.remove('ghost'); layer.innerHTML = ''; $('#cats').classList.remove('hide');
  shattering = false; q.value = '';
  setTimeout(() => ex.classList.remove('on'), 1600);
}

// Tools
const bRotate = $('#bRotate'), bLabels = $('#bLabels');
function toggleRotate() { controls.autoRotate = !controls.autoRotate; bRotate.classList.toggle('on', controls.autoRotate); }
function toggleExplode() { if (inside) exitInterior(true); if (running) { skipFlag = true; return; } exploded ? assemble() : explode(); }

/* Interior view: camera sits in the driver's seat; drag to look around. */
let inside = false;
const cabinLight = new THREE.PointLight(0xfff1e0, 0, 2.5, 2); scene.add(cabinLight);
function exitInterior(reframe) {
  if (!inside) return;
  inside = false; $('#bInside').classList.remove('on');
  camera.near = 0.1; camera.fov = 40; camera.updateProjectionMatrix();
  Object.assign(controls, { minDistance: 2, enableZoom: true, enablePan: true, rotateSpeed: 1, maxPolarAngle: Math.PI / 2 - 0.04, minPolarAngle: 0 });
  cabinLight.intensity = 0;
  if (reframe) frameCamera(0);
}
async function toggleInterior() {
  if (!carObj) return;
  if (inside) { exitInterior(true); setPhase(`${CARS[current].name} · drag to orbit 360°`, true); return; }
  if (exploded || running) { cancelAnims(); await assemble(); }
  if (exploded) return;
  const { eye, dir } = carObj.cockpit || { eye: V3(0, carObj.h + 0.5, 0), dir: V3(1, -0.3, 0) };
  inside = true; $('#bInside').classList.add('on');
  if (controls.autoRotate) toggleRotate();
  camera.near = 0.01; camera.fov = 72; camera.updateProjectionMatrix();
  Object.assign(controls, { minDistance: 0.01, enableZoom: false, enablePan: false, rotateSpeed: -0.45, maxPolarAngle: Math.PI - 0.35, minPolarAngle: 0.35 });
  cabinLight.position.copy(eye).add(V3(0.25, 0.15, 0)); cabinLight.intensity = 1.2;
  setPhase('Interior view · drag to look around', true);
  await tweenCam(eye.clone(), eye.clone().addScaledVector(dir.clone().normalize(), 0.06), 1700);
}
function toggleLabels() { labelsOn = !labelsOn; bLabels.classList.toggle('on', labelsOn); showTags(tagsVisible); }
bRotate.onclick = toggleRotate;
$('#bInside').onclick = toggleInterior;
$('#bExplode').onclick = toggleExplode;
$('#bReplay').onclick = () => loadCar(current);
$('#bSkip').onclick = () => { skipFlag = true; };
bLabels.onclick = toggleLabels;
$('#bReset').onclick = () => { exitInterior(false); frameCamera(exploded ? 1 : 0); };
$('#infoToggle').onclick = () => $('#info').classList.toggle('collapsed');
$('#bQuality').onclick = () => { qi = (qi + 1) % QUALITY.length; applyQuality(); toast(`Render quality: <b>${QUALITY[qi].name}</b><br><small style="color:var(--mut)">${renderRes()} internal resolution</small>`); };
$('#bShot').onclick = capture8K;
applyQuality();

/* Render one 7680×4320 frame off-screen and download it as PNG (falls back to the GPU's max size). */
function capture8K() {
  const W = 7680, H = 4320, sc = Math.min(1, maxTex / W), w = Math.floor(W * sc), h = Math.floor(H * sc);
  toast('Rendering 8K photo…');
  setTimeout(() => {
    const aoWas = gtao.enabled;
    try {
      gtao.enabled = false; // AO buffers at 8K would exhaust most GPUs
      renderer.setPixelRatio(1); composer.setPixelRatio(1);
      renderer.setSize(w, h, false); composer.setSize(w, h);
      mirror.getRenderTarget().setSize(w / 2, h / 2);
      camera.aspect = w / h; camera.updateProjectionMatrix();
      composer.render();
      canvas.toBlob(blob => {
        if (!blob) { toast('Your GPU could not produce an 8K image.'); return; }
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `${CARS[current].id}-${w}x${h}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        toast(`Saved ${w}×${h} photo of the ${CARS[current].name}`);
      }, 'image/png');
    } catch (err) { console.error(err); toast('8K capture failed on this device.'); }
    gtao.enabled = aoWas; onResize();
  }, 60);
}
if (isMobile && innerWidth <= 820) $('#info').classList.add('collapsed');

addEventListener('keydown', e => {
  if (e.target === q) return;
  if (e.key === '/') { e.preventDefault(); q.focus(); }
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'e' || e.key === 'E') toggleExplode();
  else if (e.key === 'r' || e.key === 'R') toggleRotate();
  else if (e.key === 'l' || e.key === 'L') toggleLabels();
  else if (e.key === 'i' || e.key === 'I') toggleInterior();
});

// Today's date in the header
$('#today').textContent = '1886 → 2023 · ' + new Date().toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

// Resize
function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  applyQuality();
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 200));

/* =====================================================================
   8. RENDER LOOP & START
   ===================================================================== */
const clock = new THREE.Clock();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = clock.getDelta();
  stepAnims(now);
  spin.forEach(m => { m.rotation.y += dt * 8; });
  ring2.rotation.z += dt * 0.15;
  controls.update();
  updateTags();
  composer.render();
}
ld(92, 'Ready');
const startIdx = Math.max(0, CARS.findIndex(c => c.id === 'f40'));
requestAnimationFrame(loop);
setTimeout(() => {
  $('#loader').classList.add('done'); window.__appReady = true;
  loadCar(startIdx);
}, 500);
</script>
